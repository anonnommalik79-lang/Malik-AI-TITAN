name: Voice Runtime V2 Final

on:
  push:
    paths:
      - ".github/workflows/voice-runtime-v2-final.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json

      - name: Apply Voice runtime v2 patch
        run: |
          python .github/scripts/fix-voice-runtime-v2.py
          python .github/scripts/fix-voice-runtime-v2-typecheck.py

      - name: Install dependencies
        working-directory: app/templates/sovereign-hub-ui
        run: npm ci

      - name: Typecheck
        working-directory: app/templates/sovereign-hub-ui
        run: npm run typecheck

      - name: Voice tests
        working-directory: app/templates/sovereign-hub-ui
        run: npm run test:voice

      - name: Account and router regression
        working-directory: app/templates/sovereign-hub-ui
        run: npm run test:account

      - name: Production build
        working-directory: app/templates/sovereign-hub-ui
        run: npm run build

      - name: Commit verified Voice runtime v2
        run: |
          git config user.name "Malik AI CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/templates/sovereign-hub-ui
          git diff --cached --quiet && exit 0
          git commit -m "fix: make Voice hear speech and honor selected voices"
          git push origin HEAD:main
