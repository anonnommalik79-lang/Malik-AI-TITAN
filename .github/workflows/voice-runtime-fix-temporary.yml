name: Malik Voice Runtime Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/voice-runtime-fix-temporary.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json

      - name: Apply repair
        working-directory: app/templates/sovereign-hub-ui
        run: node scripts/apply-voice-runtime-fix.mjs

      - name: Install
        working-directory: app/templates/sovereign-hub-ui
        run: npm ci

      - name: Typecheck
        working-directory: app/templates/sovereign-hub-ui
        run: npm run typecheck

      - name: Voice tests
        working-directory: app/templates/sovereign-hub-ui
        run: npm run test:voice

      - name: Build
        working-directory: app/templates/sovereign-hub-ui
        run: npm run build

      - name: Commit repair
        run: |
          git config user.name "Malik AI CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/templates/sovereign-hub-ui/app/api/voice/tts/route.ts
          git add app/templates/sovereign-hub-ui/components/voice/VoiceSettings.tsx
          git add app/templates/sovereign-hub-ui/components/voice/VoiceMode.tsx
          git add app/templates/sovereign-hub-ui/scripts/verify-voice-mode.mjs
          git commit -m "fix: make Voice replies audible and use clear male TTS"
          git push origin HEAD:main
