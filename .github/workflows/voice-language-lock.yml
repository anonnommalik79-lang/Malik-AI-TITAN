name: Voice Language Lock

on:
  push:
    paths:
      - ".github/workflows/voice-language-lock.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply strict Voice language lock
        run: python .github/scripts/fix-voice-language-lock.py
      - name: Python syntax
        run: python -m py_compile app/ai/voice_runtime.py run.py
      - name: Install frontend
        working-directory: app/templates/sovereign-hub-ui
        run: npm ci
      - name: Typecheck
        working-directory: app/templates/sovereign-hub-ui
        run: npm run typecheck
      - name: Voice regression
        working-directory: app/templates/sovereign-hub-ui
        run: npm run test:voice
      - name: Account/router regression
        working-directory: app/templates/sovereign-hub-ui
        run: npm run test:account
      - name: Production build
        working-directory: app/templates/sovereign-hub-ui
        run: npm run build
      - name: Commit verified Voice language lock
        run: |
          git config user.name "Malik AI CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/ai/voice_runtime.py \
            app/templates/sovereign-hub-ui/components/voice/VoiceSettings.tsx \
            app/templates/sovereign-hub-ui/components/voice/VoiceSettingsPanel.module.css \
            app/templates/sovereign-hub-ui/components/voice/VoiceMode.tsx \
            app/templates/sovereign-hub-ui/app/api/voice/turn/route.ts \
            app/templates/sovereign-hub-ui/app/api/voice/tts/route.ts \
            app/templates/sovereign-hub-ui/scripts/verify-voice-mode.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: lock Voice to selected language"
          git push origin HEAD:main
