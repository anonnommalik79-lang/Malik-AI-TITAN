name: Malik Final Attachment and Models

on:
  push:
    paths:
      - ".github/workflows/malik-final-attachment-and-models.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json

      - name: Apply final patch
        run: python .github/scripts/finalize-malik.py

      - name: Install dependencies
        working-directory: app/templates/sovereign-hub-ui
        run: npm ci

      - name: Typecheck
        working-directory: app/templates/sovereign-hub-ui
        run: npm run typecheck

      - name: Verify model catalog
        working-directory: app/templates/sovereign-hub-ui
        run: npm run test:models

      - name: Verify attachment menu
        working-directory: app/templates/sovereign-hub-ui
        run: npm run test:attachment-menu

      - name: Verify account and search sections
        working-directory: app/templates/sovereign-hub-ui
        run: npm run test:account

      - name: Verify voice section
        working-directory: app/templates/sovereign-hub-ui
        run: npm run test:voice

      - name: Production build
        working-directory: app/templates/sovereign-hub-ui
        run: npm run build

      - name: Commit verified final changes
        run: |
          git config user.name "Malik AI CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/templates/sovereign-hub-ui
          git diff --cached --quiet && exit 0
          git commit -m "feat: finalize MalikLLM routing and attachment menu"
          git push origin HEAD:main
