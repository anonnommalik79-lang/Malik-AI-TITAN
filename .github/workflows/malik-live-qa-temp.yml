name: Temporary MALIK Navigation QA

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-nav-qa:
    if: startsWith(github.head_ref, 'qa-live-')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Scan live dashboard sections
        env:
          BASE_URL: https://malikaiworld.world
        run: |
          cat > malik-live-nav-qa.mjs <<'NODE'
          import fs from 'node:fs/promises'
          import { chromium } from 'playwright'

          const base = process.env.BASE_URL
          const outDir = 'nav-artifacts'
          await fs.mkdir(outDir, { recursive: true })

          const report = {
            startedAt: new Date().toISOString(),
            base,
            auth: {},
            sections: [],
            badResponses: [],
            pageErrors: [],
          }

          const browser = await chromium.launch({ headless: true })
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
            locale: 'ru-RU',
          })
          const page = await context.newPage()

          page.on('response', response => {
            if (response.status() >= 400) {
              report.badResponses.push({ status: response.status(), url: response.url() })
            }
          })
          page.on('pageerror', error => report.pageErrors.push(error.message))

          const authResponse = await page.goto(`${base}/auth`, {
            waitUntil: 'domcontentloaded',
            timeout: 60000,
          })
          await page.waitForTimeout(2500)
          const guest = page.getByRole('button', { name: /Войти как гость/i })
          report.auth = {
            status: authResponse?.status() ?? null,
            guestVisible: await guest.isVisible().catch(() => false),
          }
          await guest.click()
          await page.waitForTimeout(5000)
          report.auth.afterGuestUrl = page.url()

          const sections = [
            ['dashboard', 'Панель управления'],
            ['final-intelligence', 'Final Intelligence'],
            ['unbreakable-ai', 'Unbreakable AI'],
            ['command-center', 'Command Center'],
            ['capabilities', 'Capabilities'],
            ['business-command-center', 'Business Command Center'],
            ['newsroom-studio', 'Newsroom Studio'],
            ['global-search', 'Глобальный поиск'],
            ['ai-generator', 'AI Генератор'],
            ['photo-generation', 'Photo Generation'],
            ['video-generation', 'Video Generation'],
            ['website-builder', 'Website Builder'],
            ['code-generator', 'Code Generator'],
          ]

          async function firstVisible(locator) {
            const count = await locator.count()
            for (let i = 0; i < count; i++) {
              const item = locator.nth(i)
              if (await item.isVisible().catch(() => false)) return item
            }
            return null
          }

          for (const [id, label] of sections) {
            const started = Date.now()
            const entry = { id, label }
            try {
              const target = await firstVisible(page.getByText(label, { exact: true }))
              if (!target) throw new Error(`Visible navigation item not found: ${label}`)
              await target.scrollIntoViewIfNeeded()
              await target.click({ timeout: 10000 })
              await page.waitForTimeout(2200)

              const body = await page.locator('body').innerText()
              const headings = await page.locator('h1:visible,h2:visible,h3:visible').allInnerTexts().catch(() => [])
              entry.ok = true
              entry.url = page.url()
              entry.latencyMs = Date.now() - started
              entry.headings = headings.slice(0, 20)
              entry.bodyPreview = body.slice(0, 1800)
              entry.visibleTextLength = body.length
              entry.errorTextDetected = /Application error|Internal Server Error|Something went wrong|Ошибка приложения|Dashboard export не найден/i.test(body)
              await page.screenshot({ path: `${outDir}/${id}.png`, fullPage: false })
            } catch (error) {
              entry.ok = false
              entry.latencyMs = Date.now() - started
              entry.error = String(error?.stack || error)
              await page.screenshot({ path: `${outDir}/${id}-failed.png`, fullPage: false }).catch(() => {})
            }
            report.sections.push(entry)
            console.log(`\n=== ${id} ===`)
            console.log(JSON.stringify(entry, null, 2).slice(0, 7000))
          }

          report.badResponses = Array.from(
            new Map(report.badResponses.map(item => [`${item.status}:${item.url}`, item])).values()
          )
          report.finishedAt = new Date().toISOString()
          await fs.writeFile(`${outDir}/navigation-results.json`, JSON.stringify(report, null, 2))
          console.log('\n=== NAV SUMMARY ===')
          console.log(JSON.stringify(report, null, 2).slice(0, 20000))

          await context.close()
          await browser.close()
          NODE

          node ./malik-live-nav-qa.mjs

      - name: Upload navigation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malik-live-navigation-results
          path: nav-artifacts
          if-no-files-found: warn
          retention-days: 3
