name: Install legendary image generation flow

on:
  push:
    branches:
      - feat/legendary-image-intent-loader
    paths:
      - '.github/workflows/malik-image-intent-install.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/legendary-image-intent-loader
          fetch-depth: 0

      - name: Wire strict image intent and live animation
        shell: python
        run: |
          from pathlib import Path

          root = Path('app/templates/sovereign-hub-ui')
          dashboard = root / 'components/sovereign/dashboard.tsx'
          chat_view = root / 'components/sovereign/chat-view.tsx'

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding='utf-8-sig')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              dashboard,
              'import { clientFetchWithTimeout } from "@/lib/api-client"\n',
              'import { clientFetchWithTimeout } from "@/lib/api-client"\nimport { isExplicitImageGenerationRequest } from "@/lib/ai/image-intent"\n',
              'dashboard import',
          )

          replace_once(
              dashboard,
              '''  const command = parseMediaCommand(prompt)\n  if (command) return command.kind\n\n  // An explicitly chosen composer mode counts as consent; "auto" never does.\n  if (mode === "image") return "image"\n''',
              '''  const command = parseMediaCommand(prompt)\n  if (command) return command.kind\n\n  // Natural-language photo requests are accepted only when the request is an\n  // explicit CREATE-image intent. Mentioning or discussing photos stays chat.\n  if (isExplicitImageGenerationRequest(prompt)) return "image"\n\n  // An explicitly chosen composer mode counts as consent; "auto" never does.\n  if (mode === "image") return "image"\n''',
              'dashboard intent gate',
          )

          replace_once(
              chat_view,
              'import { VoiceWaveIcon } from "@/components/voice/VoiceWaveIcon"\n',
              'import { VoiceWaveIcon } from "@/components/voice/VoiceWaveIcon"\nimport { isExplicitImageGenerationRequest } from "@/lib/ai/image-intent"\nimport { ImageGenerationMotion } from "./image-generation-motion"\n',
              'chat imports',
          )

          replace_once(
              chat_view,
              '''  if (value.startsWith("/image ") || value.startsWith("/photo ") || value.startsWith("/img ")) return "image"\n  if (value.startsWith("/video ") || value.startsWith("/veo ")) return "video"\n''',
              '''  if (value.startsWith("/image ") || value.startsWith("/photo ") || value.startsWith("/img ")) return "image"\n  if (isExplicitImageGenerationRequest(text)) return "image"\n  if (value.startsWith("/video ") || value.startsWith("/veo ")) return "video"\n''',
              'chat generation type',
          )

          replace_once(
              chat_view,
              '''  const activeGenerationType = useMemo(() => {\n    const lastUserMessage = [...messages].reverse().find((message) => message.role === "user")\n    const attachmentHint = attachments.map((item) => item.kind).join(" ")\n    return detectGenerationStatusType(`${lastUserMessage?.content || prompt} ${attachmentHint}`)\n  }, [attachments, messages, prompt])\n''',
              '''  const activeGenerationType = useMemo(() => {\n    const lastUserMessage = [...messages].reverse().find((message) => message.role === "user")\n    return detectGenerationStatusType(lastUserMessage?.content || prompt)\n  }, [messages, prompt])\n''',
              'chat active generation type',
          )

          replace_once(
              chat_view,
              '''  const previewImage = Boolean(url) && !isVideo && (isDataSvgUrl(url) || isImageLikeUrl(url))\n  const progress = isVideo && liveMedia.status === "ready" && !realVideo ? 82 : mediaProgress(liveMedia)\n\n  const statusLabel: Record<InlineMediaGenerationStatus, string> = {\n''',
              '''  const previewImage = Boolean(url) && !isVideo && (isDataSvgUrl(url) || isImageLikeUrl(url))\n  const progress = isVideo && liveMedia.status === "ready" && !realVideo ? 82 : mediaProgress(liveMedia)\n\n  // Photo generation has its own clean, no-glass experience. The moving photo\n  // field stays alive until the browser has actually loaded the final image;\n  // only then does the generated photo fade in and the animation disappear.\n  if (!isVideo) {\n    return (\n      <ImageGenerationMotion\n        prompt={liveMedia.prompt}\n        resultUrl={previewImage ? url : undefined}\n        failed={isFailed}\n        error={liveMedia.error}\n      />\n    )\n  }\n\n  const statusLabel: Record<InlineMediaGenerationStatus, string> = {\n''',
              'chat image generation card',
          )

          print('Malik image generation flow wired successfully')

      - name: Install dependencies
        working-directory: app/templates/sovereign-hub-ui
        run: npm ci --ignore-scripts

      - name: TypeScript check
        working-directory: app/templates/sovereign-hub-ui
        run: npm run typecheck

      - name: Commit verified feature and remove installer
        run: |
          git config user.name "Malik AI Automation"
          git config user.email "malik-ai@users.noreply.github.com"
          git rm .github/workflows/malik-image-intent-install.yml
          git add app/templates/sovereign-hub-ui/components/sovereign/dashboard.tsx
          git add app/templates/sovereign-hub-ui/components/sovereign/chat-view.tsx
          git commit -m "feat(malik-ai): legendary photo intent and live generation motion"
          git push origin HEAD:feat/legendary-image-intent-loader
