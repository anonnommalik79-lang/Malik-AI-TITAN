name: Live mobile MalikVideo screenshot

on:
  push:
    paths:
      - ".github/workflows/mobile-live-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Capture deployed mobile UI
        run: |
          cat > shot.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 2,
            isMobile: true,
            hasTouch: true,
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
          });
          const page = await context.newPage();

          await page.goto('https://malikaiworld.world/', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await page.waitForTimeout(7000);

          const videoView = page.locator('[data-view="video-generation"]');
          if (!(await videoView.count())) {
            const plus = page.getByRole('button', { name: /Добавить файл или инструмент/i });
            if (await plus.count()) {
              await plus.first().click().catch(() => {});
              await page.waitForTimeout(700);
            }

            const videoButton = page.getByRole('button', { name: /^Видео$/i });
            if (await videoButton.count()) {
              await videoButton.first().click().catch(() => {});
            } else {
              const videoText = page.getByText(/^Видео$/i);
              if (await videoText.count()) await videoText.first().click().catch(() => {});
            }

            await page.waitForTimeout(7000);
          }

          await page.screenshot({ path: 'malikvideo-live-mobile.png', fullPage: true });
          console.log('URL:', page.url());
          console.log('video-view:', await page.locator('[data-view="video-generation"]').count());
          console.log('title:', await page.title());
          await browser.close();
          EOF
          node shot.mjs

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: malikvideo-live-mobile
          path: malikvideo-live-mobile.png
          if-no-files-found: error
