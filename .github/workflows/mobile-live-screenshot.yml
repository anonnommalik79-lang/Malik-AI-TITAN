name: Live mobile MalikVideo screenshot

on:
  push:
    paths:
      - ".github/workflows/mobile-live-screenshot.yml"
      - "app/templates/sovereign-hub-ui/app/visual-test/video/**"
      - "app/templates/sovereign-hub-ui/components/sovereign/video-generation/**"
      - "app/templates/sovereign-hub-ui/app/video-mobile-*.css"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: app/templates/sovereign-hub-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm i --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start Malik AI visual preview
        env:
          GITHUB_ACTIONS: "true"
        run: |
          npm run dev > /tmp/malik-next.log 2>&1 &
          echo $! > /tmp/malik-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/visual-test/video >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/malik-next.log
          exit 1

      - name: Capture actual MalikVideo section
        run: |
          cat > shot.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 430, height: 932 },
            deviceScaleFactor: 2,
            isMobile: true,
            hasTouch: true,
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
          });
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:3000/visual-test/video', { waitUntil: 'networkidle', timeout: 90000 });
          await page.waitForSelector('[data-view="video-generation"]', { timeout: 30000 });
          await page.waitForTimeout(2500);
          await page.screenshot({ path: 'malikvideo-section-mobile.png', fullPage: true });
          await browser.close();
          EOF
          node shot.mjs

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: malikvideo-section-mobile
          path: app/templates/sovereign-hub-ui/malikvideo-section-mobile.png
          if-no-files-found: error
