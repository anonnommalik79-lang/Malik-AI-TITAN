name: Plugin engine check

on:
  pull_request:
    paths:
      - 'app/templates/sovereign-hub-ui/**'
      - 'docs/PLUGIN_AUDIT_2026-08-28.md'
      - '.github/workflows/plugin-engine-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/templates/sovereign-hub-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
