name: Website generator browser regression

on:
  pull_request:
    paths:
      - "app/templates/sovereign-hub-ui/components/sovereign/work-code/WebsiteProjectCard.tsx"
      - "app/templates/sovereign-hub-ui/scripts/verify-website-engine-browser.mjs"
      - "app/templates/sovereign-hub-ui/lib/website/engine/**"
      - ".github/workflows/website-engine-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app/templates/sovereign-hub-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json
      - name: Install app dependencies
        run: npm ci --legacy-peer-deps
      - name: Install browser test driver
        run: npm install --no-save --legacy-peer-deps playwright@1.58.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify saved project checkpoints, preview and stage recovery
        run: npm run test:website-engine-browser
