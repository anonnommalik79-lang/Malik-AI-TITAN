name: Malik AGI proof beta

on:
  pull_request:
    paths:
      - "app/templates/sovereign-hub-ui/lib/agi/**"
      - "app/templates/sovereign-hub-ui/app/api/agi/**"
      - "app/templates/sovereign-hub-ui/scripts/verify-malik-agi.mjs"
      - "app/templates/sovereign-hub-ui/components/agi/**"
      - "app/templates/sovereign-hub-ui/app/agi/**"
      - ".github/workflows/malik-agi-proof.yml"
  push:
    paths:
      - "app/templates/sovereign-hub-ui/lib/agi/**"
      - "app/templates/sovereign-hub-ui/app/api/agi/**"
      - "app/templates/sovereign-hub-ui/scripts/verify-malik-agi.mjs"
      - "app/templates/sovereign-hub-ui/components/agi/**"
      - "app/templates/sovereign-hub-ui/app/agi/**"
      - ".github/workflows/malik-agi-proof.yml"

jobs:
  mission-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: app/templates/sovereign-hub-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify four-agent state machine and evidence gates
        run: node --experimental-strip-types --no-warnings --test scripts/verify-malik-agi.mjs

  agi-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: app/templates/sovereign-hub-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck Next.js project and AGI console
        run: npx tsc --noEmit --pretty false
