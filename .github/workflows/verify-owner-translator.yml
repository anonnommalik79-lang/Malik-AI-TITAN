name: Verify Owner Translator

on:
  push:
    paths:
      - ".github/workflows/verify-owner-translator.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply final owner and translator patch
        run: python .github/scripts/finalize-owner-translator.py
      - name: Python syntax
        run: python -m py_compile run.py app/ai/translator_runtime.py app/ai/scale/routes.py
      - name: Verify production contracts
        run: |
          grep -q 'Translator runtime connected: /api/translator' run.py
          grep -q 'OWNER_EMAIL' app/ai/scale/routes.py
          grep -q '"plan": plan' app/ai/scale/routes.py
          grep -q 'MALIK_VERIFIED_OWNER_SESSION' app/templates/sovereign-hub-ui/components/sovereign/dashboard.tsx
          grep -q 'provider: "malik-translator"' app/templates/sovereign-hub-ui/app/api/translator/route.ts
          ! grep -q 'Groq · 2M токенов/день' app/templates/sovereign-hub-ui/lib/ai/malik-models.ts
      - name: Install frontend
        working-directory: app/templates/sovereign-hub-ui
        run: npm ci
      - name: Typecheck
        working-directory: app/templates/sovereign-hub-ui
        run: npm run typecheck
      - name: Account and owner regression
        working-directory: app/templates/sovereign-hub-ui
        run: npm run test:account
      - name: Voice regression
        working-directory: app/templates/sovereign-hub-ui
        run: npm run test:voice
      - name: Production build
        working-directory: app/templates/sovereign-hub-ui
        run: npm run build
      - name: Commit verified source changes
        run: |
          git config user.name "Malik AI CI"
          git config user.email "actions@users.noreply.github.com"
          git add run.py \
            app/ai/scale/routes.py \
            app/ai/translator_runtime.py \
            app/templates/sovereign-hub-ui/components/translator/MalikTranslator.tsx \
            app/templates/sovereign-hub-ui/app/api/translator/route.ts \
            app/templates/sovereign-hub-ui/components/sovereign/dashboard.tsx \
            app/templates/sovereign-hub-ui/components/sovereign/MalikModelSelector.tsx \
            app/templates/sovereign-hub-ui/lib/ai/malik-models.ts \
            app/templates/sovereign-hub-ui/lib/ai/router.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: polish translator and unlock verified owner"
          git push origin HEAD:main
