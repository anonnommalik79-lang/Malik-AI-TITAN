name: Production build check

on:
  push:
    branches: [main]
    paths:
      - "render.yaml"
      - "app/templates/sovereign-hub-ui/**"
      - ".github/workflows/production-build-check.yml"
  pull_request:
    paths:
      - "render.yaml"
      - "app/templates/sovereign-hub-ui/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/templates/sovereign-hub-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Verify Malik model registry
        run: npm run test:models

      - name: Verify Malik Action OS
        run: npm run test:action-os

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run clean && npm run build

      - name: Verify live domain health
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 24); do
            rm -f /tmp/malik-health.json
            code=$(curl -L -sS --max-time 12 -o /tmp/malik-health.json -w '%{http_code}' https://malikaiworld.world/api/health)
            echo "attempt=$attempt http=$code"
            if [ -f /tmp/malik-health.json ]; then
              head -c 1200 /tmp/malik-health.json
              echo
            fi
            if [ "$code" = "200" ] && grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/malik-health.json 2>/dev/null; then
              echo "Malik AI live health is OK"
              echo "Provider configuration snapshot:"
              curl -L -sS --max-time 12 https://malikaiworld.world/api/health/providers | head -c 3000
              echo
              exit 0
            fi
            sleep 10
          done
          echo "Live Malik AI health did not recover during the verification window."
          exit 1

      - name: Smoke test live free Malik models
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        shell: bash
        run: |
          set -e
          rm -f /tmp/malik-cookies.txt
          # Use the same supported guest flow as a real browser so Compute auth,
          # quotas and model routing are exercised instead of bypassed.
          curl -sS --max-time 20 -D /tmp/malik-guest-headers.txt \
            -c /tmp/malik-cookies.txt \
            -o /dev/null \
            https://malikaiworld.world/guest
          grep -q 'malik-guest' /tmp/malik-cookies.txt

          for model in malik-20b malik-fast-120b malik-27b; do
            echo "Testing $model"
            rm -f /tmp/malik-model.txt
            code=$(curl -L -sS --max-time 60 \
              -b /tmp/malik-cookies.txt \
              -c /tmp/malik-cookies.txt \
              -o /tmp/malik-model.txt \
              -w '%{http_code}' \
              -X POST https://malikaiworld.world/api/stream \
              -H 'content-type: application/json' \
              --data "{\"prompt\":\"Ответь только одним словом: OK\",\"model\":\"$model\",\"stream\":false}")
            echo "http=$code"
            head -c 800 /tmp/malik-model.txt || true
            echo
            if [ "$code" != "200" ] || [ ! -s /tmp/malik-model.txt ]; then
              echo "$model failed live smoke test"
              exit 1
            fi
          done
          echo "All three free Malik models returned live responses through guest auth."
