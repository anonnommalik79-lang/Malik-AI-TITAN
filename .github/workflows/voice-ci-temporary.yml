name: Malik Voice CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/voice-ci-temporary.yml'
      - 'app/templates/sovereign-hub-ui/components/voice/**'
      - 'app/templates/sovereign-hub-ui/app/api/voice/**'
      - 'app/templates/sovereign-hub-ui/app/api/transcribe/**'
      - 'app/templates/sovereign-hub-ui/lib/transcribe/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/templates/sovereign-hub-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:voice
