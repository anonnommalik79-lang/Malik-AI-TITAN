name: MalikVideo stack check

on:
  pull_request:
    paths:
      - "services/malikvideo-worker/**"
      - "services/malikvideo-enhancer/**"
      - "scripts/malikvideo-h3/**"
      - "docs/malikvideo-h3/**"
      - "app/templates/sovereign-hub-ui/lib/media/**"
      - "app/templates/sovereign-hub-ui/app/api/media/video/**"
      - ".env.example"
      - ".github/workflows/malikvideo-stack-check.yml"
  push:
    branches: [main]
    paths:
      - "services/malikvideo-worker/**"
      - "services/malikvideo-enhancer/**"
      - "scripts/malikvideo-h3/**"
      - "app/templates/sovereign-hub-ui/lib/media/**"
      - "app/templates/sovereign-hub-ui/app/api/media/video/**"

permissions:
  contents: read

jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API-only dependencies
        run: |
          python -m pip install -r services/malikvideo-worker/requirements.txt
          python -m pip install -r services/malikvideo-enhancer/requirements.txt
      - name: Compile Python workers
        run: |
          python -m py_compile services/malikvideo-worker/app.py
          python -m py_compile services/malikvideo-enhancer/app.py
      - name: Validate shell launchers
        run: |
          bash -n scripts/malikvideo-h3/launch-fl2va.sh
          bash -n scripts/malikvideo-h3/smoke-test.sh
          bash -n scripts/malikvideo-h3/smoke-worker.sh
          bash -n services/malikvideo-worker/install-seedvr2.sh
          bash -n services/malikvideo-enhancer/install-seedvr2.sh

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/templates/sovereign-hub-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/templates/sovereign-hub-ui/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
