name: Export fix branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'fix/security-context-routing-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: malik-fix-branch-source
          path: app/templates/sovereign-hub-ui
          retention-days: 1
