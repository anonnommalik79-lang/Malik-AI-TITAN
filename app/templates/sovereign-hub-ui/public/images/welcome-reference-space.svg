<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="spaceCore" cx="55%" cy="42%" r="72%">
      <stop offset="0" stop-color="#123a8a"/>
      <stop offset=".36" stop-color="#071a46"/>
      <stop offset=".7" stop-color="#050817"/>
      <stop offset="1" stop-color="#02030a"/>
    </radialGradient>
    <radialGradient id="purpleNebula" cx="80%" cy="7%" r="45%">
      <stop offset="0" stop-color="#d946ef" stop-opacity=".86"/>
      <stop offset=".14" stop-color="#8b5cf6" stop-opacity=".48"/>
      <stop offset=".42" stop-color="#1d4ed8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomNebula" cx="50%" cy="95%" r="62%">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".52"/>
      <stop offset=".28" stop-color="#2563eb" stop-opacity=".26"/>
      <stop offset=".64" stop-color="#050617" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetGlow" cx="8%" cy="48%" r="72%">
      <stop offset="0" stop-color="#e0f7ff" stop-opacity=".9"/>
      <stop offset=".035" stop-color="#7dd3fc" stop-opacity=".72"/>
      <stop offset=".12" stop-color="#2563eb" stop-opacity=".42"/>
      <stop offset=".32" stop-color="#0f274f" stop-opacity=".9"/>
      <stop offset="1" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="meteor" x1="0" x2="1">
      <stop offset="0" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset=".55" stop-color="#60a5fa" stop-opacity=".42"/>
      <stop offset=".9" stop-color="#ffffff" stop-opacity=".94"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="rockLight" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8d99aa"/>
      <stop offset=".42" stop-color="#303847"/>
      <stop offset="1" stop-color="#070a12"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="rockTex" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values=".22 0 0 0 0  0 .22 0 0 0  0 0 .24 0 0  0 0 0 .34 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="screen"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#spaceCore)"/>
