services:
  - type: web
    name: malik-ai-sovereign
    env: node
    plan: starter
    rootDir: app/templates/sovereign-hub-ui
    buildCommand: npm ci --legacy-peer-deps && npm run clean && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://malikaiworld.world
      - key: MALIK_SITE_URL
        value: https://malikaiworld.world
      - key: AI_FREE_MODE
        value: "true"
      - key: TEXT_PROVIDER_ORDER
        value: "modelscope,aihubmix,cerebras,groq,gemini,openrouter"
      - key: CODE_PROVIDER_ORDER
        value: "aihubmix,modelscope,cerebras,groq,gemini,openrouter"
      - key: MODELSCOPE_API_KEY
        sync: false
      - key: MODELSCOPE_BASE_URL
        value: https://api-inference.modelscope.cn/v1
      - key: MALIK_QWEN_MODEL
        value: Qwen/Qwen3.5-397B-A17B
      - key: MALIK_REASON_MODEL
        value: ZhipuAI/GLM-5.2
      - key: MALIK_ERNIE_MODEL
        value: PaddlePaddle/ERNIE-4.5-300B-A47B-PT
      - key: AIHUBMIX_API_KEY
        sync: false
      - key: AIHUBMIX_BASE_URL
        value: https://aihubmix.com/v1
      - key: AIHUBMIX_PRIMARY_MODEL
        value: coding-glm-5.3-free
      - key: AIHUBMIX_VISION_MODEL
        value: coding-kimi-k3-free
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_BASE_URL
        value: https://api.cerebras.ai/v1
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_MODEL
        value: gpt-4o
      - key: MALIK_GOD_PROVIDER_CHAIN
        value: "github,openrouter,deepseek"
      - key: MALIK_GOD_SHOW_PROVIDER
        value: "false"
      - key: MALIK_GOD_MAX_OUTPUT_TOKENS
        value: "2200"
      - key: MALIK_GOD_PROVIDER_TIMEOUT_MS
        value: "18000"
      - key: WORKOS_CLIENT_ID
        sync: false
      - key: WORKOS_API_KEY
        sync: false
      - key: WORKOS_COOKIE_PASSWORD
        sync: false
      - key: WORKOS_REDIRECT_URI
        value: https://malikaiworld.world/callback
      - key: NEXT_PUBLIC_WORKOS_REDIRECT_URI
        value: https://malikaiworld.world/callback
      - key: MEDIA_STORAGE_BUCKET
        sync: false
      - key: MEDIA_STORAGE_REGION
        value: auto
      - key: MEDIA_STORAGE_ENDPOINT
        sync: false
      - key: MEDIA_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: MEDIA_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: MALIK_CODEX_PROVIDER_FALLBACK
        value: "0"
      - key: MALIK_CODEX_AUTO_MODE
        value: "0"
      - key: MEDIA_VIDEO_PROVIDER_ORDER
        value: "fal-video,luma-video,runway-video,fal-kling-pro-video,google-veo,pika-video,kling-video,replicate-video"
      - key: MEDIA_PRO_VIDEO_PROVIDER_ORDER
        value: "google-veo,runway-video,fal-kling-pro-video,luma-video,fal-video,pika-video,kling-video,replicate-video"
      - key: OPENAI_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: STABILITY_IMAGE_URL
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_IMAGE_URL
        sync: false
      - key: REPLICATE_VIDEO_URL
        sync: false
      - key: FAL_KEY
        sync: false
      - key: FAL_IMAGE_URL
        sync: false
      - key: FAL_VIDEO_URL
        value: "https://fal.run/fal-ai/wan/v2.7/text-to-video"
      - key: FAL_PRO_VIDEO_URL
        value: "https://fal.run/fal-ai/kling-video/o3/4k/text-to-video"
      - key: GOOGLE_VEO_API_KEY
        sync: false
      - key: GOOGLE_VEO_VIDEO_URL
        value: "https://generativelanguage.googleapis.com/v1beta/models/veo-3.1-generate-preview:predictLongRunning"
      - key: GOOGLE_VEO_MODEL
        value: "veo-3.1-generate-preview"
      - key: GOOGLE_VEO_RESOLUTION
        value: "720p"
      - key: GOOGLE_VEO_DURATION_SECONDS
        value: "8"
      - key: GOOGLE_VEO_NEGATIVE_PROMPT
        value: "cartoon, drawing, low quality, distorted, blurry"
      - key: LEONARDO_API_KEY
        sync: false
      - key: LEONARDO_IMAGE_URL
        sync: false
      - key: RUNWAY_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: RUNWAY_VIDEO_URL
        value: "https://api.dev.runwayml.com/v1/text_to_video"
      - key: RUNWAY_VIDEO_MODEL
        value: "gen4.5"
      - key: RUNWAY_API_VERSION
        value: "2024-11-06"
      - key: LUMA_API_KEY
        sync: false
      - key: LUMAAI_API_KEY
        sync: false
      - key: LUMA_VIDEO_URL
        value: "https://api.lumalabs.ai/dream-machine/v1/generations"
      - key: LUMA_VIDEO_MODEL
        value: "ray-2"
      - key: LUMA_VIDEO_RESOLUTION
        value: "720p"
      - key: LUMA_VIDEO_DURATION
        value: "5s"
      - key: PIKA_API_KEY
        sync: false
      - key: PIKA_VIDEO_URL
        sync: false
      - key: KLING_API_KEY
        sync: false
      - key: KLING_VIDEO_URL
        sync: false
      - key: MEDIA_PRO_ACCESS_CODE
        sync: false
